<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OSRS TCG Pull Rates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --theme-bg: #141210;
    --page-base: #1c1a17;
    --page-mid: #25221e;
    --panel-base: #342e27;
    --panel-mid: #3c352c;
    --panel-lift: #463e34;
    --panel-border: #8c78586b;
    --panel-chamfer: .85rem;
    --control-chamfer: .35rem;
    --control-face: #4e4740;
    --control-face-hover: #5a5248;
    --input-placeholder: #b8aea0;
    --rl-select: #d2b36a;
    --rl-highlight: #e8c458;
    --rl-control-border: #8a7355;
    --rl-text: #fff;
    --rl-muted: #b0a899;
    --rl-light-gray: #c8c0b4;
    --font-ui: "IBM Plex Sans", "Segoe UI", Tahoma, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-ui); color: var(--rl-text); margin: 0; line-height: 1.35;
    background-color: #0a0a0a;
    background-image: linear-gradient(#00000073, #00000073), url("art/background/osrs_card_pile_perspective_bg.jpg");
    background-size: cover; background-position: center; background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  .site-chrome {
    display: flex; align-items: center; justify-content: space-between;
    padding: .45rem 1rem; background: color-mix(in srgb, var(--page-base) 88%, transparent);
    border-bottom: 1px solid var(--panel-border);
    position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
  }
  .logo { font-weight: 800; font-size: 1.05rem; letter-spacing: .02em; user-select: none; }
  .logo .gold { color: var(--rl-select); }
  .logo .white { color: #fff; }
  .chamfer { clip-path: polygon(var(--ch) 0, calc(100% - var(--ch)) 0, 100% var(--ch), 100% calc(100% - var(--ch)), calc(100% - var(--ch)) 100%, var(--ch) 100%, 0 calc(100% - var(--ch)), 0 var(--ch)); }
  .main { max-width: 1400px; margin: 1.25rem auto 2rem; padding: 0 .75rem; }
  .panel {
    --ch: var(--panel-chamfer);
    background: color-mix(in srgb, var(--panel-base) 94%, transparent);
    border: 1px solid var(--panel-border);
    box-shadow: 0 14px 34px #0000006b;
    padding: 0 0 1rem;
  }
  .panel__titlebar {
    text-align: center; padding: .55rem .75rem; margin-bottom: .35rem;
    border-bottom: 1px solid var(--panel-border);
    background: color-mix(in srgb, var(--panel-mid) 80%, transparent);
  }
  .panel__title {
    margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: .02em;
    color: var(--rl-highlight); text-shadow: 0 2px 0 #00000088;
  }
  .panel__sub { color: var(--rl-muted); font-size: .78rem; margin-top: 2px; }
  .panel__sub a { color: var(--rl-select); text-decoration: none; }
  .panel__sub a:hover { text-decoration: underline; }
  .stats { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; padding: .6rem .75rem .2rem; }
  .stat {
    background: var(--control-face); padding: .35rem .9rem; text-align: center;
    border: 1px solid var(--rl-control-border);
  }
  .stat b { display: block; font-size: 1.05rem; color: var(--rl-highlight); font-weight: 700; }
  .stat span { font-size: .72rem; color: var(--rl-muted); }
  .controls { display: flex; gap: .5rem; flex-wrap: wrap; padding: .5rem .75rem .75rem; }
  input, select, .mselect__btn {
    background: var(--control-face); color: var(--rl-text);
    border: 1px solid var(--rl-control-border); border-radius: 0;
    padding: .5rem .75rem; font-size: .9rem; font-family: var(--font-ui); outline: none;
  }
  input { flex: 1; min-width: 220px; }
  input::placeholder { color: var(--input-placeholder); }
  input:focus, select:focus, .mselect__btn:focus { border-color: var(--rl-select); box-shadow: 0 0 0 1px color-mix(in srgb, var(--rl-select) 55%, transparent); }
  select:hover, .mselect__btn:hover { background: var(--control-face-hover); }
  .mselect { position: relative; }
  .mselect__btn { cursor: pointer; white-space: nowrap; }
  .mselect__btn.has-sel { border-color: var(--rl-select); color: var(--rl-highlight); }
  .mselect__btn .caret { font-size: .7rem; margin-left: .4rem; }
  .mselect__menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
    min-width: 190px; max-height: 420px; overflow: auto;
    background: var(--page-mid); border: 1px solid var(--rl-control-border);
    box-shadow: 0 10px 26px #000000a0; padding: .25rem; display: flex; flex-direction: column;
  }
  .mselect__menu[hidden] { display: none; }
  .mselect__opt {
    display: flex; align-items: center; gap: .5rem; width: 100%; text-align: left;
    background: none; color: var(--rl-light-gray); border: 0; cursor: pointer;
    padding: .35rem .5rem; font-size: .84rem; font-family: var(--font-ui); white-space: nowrap;
  }
  .mselect__opt:hover { background: var(--control-face-hover); color: #fff; }
  .mselect__opt .box {
    width: 14px; height: 14px; flex: none; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--rl-control-border); background: #00000042; font-size: .7rem; line-height: 1;
  }
  .mselect__opt.is-selected { color: var(--rl-highlight); }
  .mselect__opt.is-selected .box { background: var(--rl-select); border-color: var(--rl-select); color: #1c1a17; font-weight: 700; }
  .mselect__count { margin-left: auto; font-size: .72rem; color: var(--rl-muted); }
  .tablewrap { overflow: auto; max-height: calc(100vh - 260px); border-top: 1px solid var(--panel-border); }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; table-layout: fixed; }
  th, td { padding: .45rem .7rem; text-align: left; border-bottom: 1px solid #ffffff0d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th {
    cursor: pointer; user-select: none; color: var(--rl-muted);
    position: sticky; top: 0; background: var(--page-mid); z-index: 2;
    font-weight: 600; font-size: .8rem;
  }
  th:hover { color: var(--rl-highlight); }
  th.num, td.num { text-align: right; }
  td { color: var(--rl-light-gray); }
  tr:hover td { background: color-mix(in srgb, var(--panel-lift) 55%, transparent); }
  .cardname { display: flex; align-items: center; gap: .55rem; font-weight: 600; color: #fff; }
  .icon-slot {
    width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center;
    background: #00000042; border: 1px solid var(--panel-border); overflow: hidden;
  }
  .icon-slot img { width: 100%; height: 100%; object-fit: contain; }
  .icon-slot.empty::after { content: "?"; color: var(--rl-muted); font-size: .8rem; }
  a { color: var(--rl-select); text-decoration: none; }
  a:hover { color: var(--rl-highlight); text-decoration: underline; }
  /* official tier colors (from the osrs-tcg.net client bundle) */
  .tname { text-shadow: 0 1px 2px #000000aa; }
  a.tname:hover { filter: brightness(1.35); text-decoration: underline; }
  .tname-Common { color: #FFFFFF; }
  .tname-Uncommon { color: #2ECC71; }
  .tname-Rare { color: #3498DB; }
  .tname-Epic { color: #9B59B6; }
  .tname-Legendary { color: #E74C3C; }
  .tname-Mythic { color: #FF6EC7; }
  .tname-Godly { color: #F2C94C; }
  .rarity { display: inline-block; padding: .15rem .6rem; font-size: .72rem; font-weight: 700; letter-spacing: .03em; color: #fff; }
  .kindtag { display: inline-block; margin-left: .4rem; padding: .1rem .45rem; font-size: .68rem; font-weight: 600; color: var(--rl-muted); background: #ffffff14; border: 1px solid var(--panel-border); vertical-align: middle; }
  .rarity-chip { cursor: pointer; }
  .Common { background: #3f3a33; color: #c8c0b4; }
  .Uncommon { background: #26583B; color: #7de89f; }
  .Rare { background: #28485D; color: #7db8e8; }
  .Epic { background: #34253B; color: #b07de0; }
  .Legendary { background: #612F2A; color: #e88a7d; }
  .Mythic { background: #693A57; color: #ff9ed6; }
  .Godly { background: #65572F; color: #e8c458; }
  .unknown { background: #2a2723; color: #8a857c; }
  .chamfer-sm { --ch: var(--control-chamfer); }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #8a7355a8; }
  ::-webkit-scrollbar-thumb:hover { background: #d2b36ad1; }
  #preview {
    position: fixed; display: none; z-index: 60; pointer-events: none;
    background: var(--page-mid); border: 1px solid var(--rl-control-border);
    box-shadow: 0 14px 34px #000000b0; padding: 8px;
  }
  #preview img { display: block; width: 240px; height: 240px; object-fit: contain; }
  .site-footer {
    text-align: center; color: var(--rl-muted); font-size: .75rem;
    border-top: 1px solid var(--panel-border); padding: .5rem; margin-top: 1rem;
  }
</style>
</head>
<body>
<div class="site-chrome">
  <div class="logo"><span class="gold">OSRS</span><span class="white"> - TCG</span></div>
  <div class="logo" style="font-size:.8rem;font-weight:600;color:var(--rl-muted)">Pull rates</div>
</div>
<div class="main">
  <div class="panel chamfer">
    <div class="panel__titlebar">
      <h1 class="panel__title">Card pull rates</h1>
      <div class="panel__sub" id="sub"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search card name...">
      <div class="mselect chamfer-sm" id="ms-tier"></div>
      <div class="mselect chamfer-sm" id="ms-coll"></div>
      <div class="mselect chamfer-sm" id="ms-type"></div>
    </div>
    <div class="tablewrap">
      <table id="table">
        <thead><tr>
          <th data-k="name" title="Click: sort by this column. Shift-click: add as a secondary sort (or flip its direction).">Card</th>
          <th data-k="rarity" title="Click: sort by this column. Shift-click: add as a secondary sort (or flip its direction).">Tier</th>
          <th class="num" data-k="pulledNormal" title="Total times this card has ever been pulled from packs">Pulled (normal)</th>
          <th class="num" data-k="pulledFoil" title="Total times this card has ever been pulled from packs (foil)">Pulled (foil)</th>
          <th class="num" data-k="pulled">Total pulled</th>
          <th class="num" data-k="pullRatePct">Pull rate %</th>
          <th class="num" data-k="oneInX">1 in X</th>
          <th class="num" data-k="existNormal" title="Copies currently in circulation (supply). 'Pulled' counts pack pulls ever (interest). Supply can exceed pulls, presumably due to beta collection imports.">Exist (normal)</th>
          <th class="num" data-k="existFoil" title="Copies currently in circulation (supply). 'Pulled' counts pack pulls ever (interest). Supply can exceed pulls, presumably due to beta collection imports.">Exist (foil)</th>
          <th class="num" data-k="scarcity" title="Pulled minus exist (normal+foil). Positive: pulled often but few copies currently exist (relatively scarce). Negative: more copies exist than have been pulled from packs, presumably due to beta collection imports.">Pulled − exist</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<div id="preview" class="chamfer-sm"><img alt=""></div>
<div class="site-footer">Unofficial fan-made data viewer · data from osrs-tcg.net public API · card art © OSRS TCG</div>
<script src="data.js"></script>
<script>
const D = window.PULL_DATA;
// "npc:{id}" rows that failed to resolve are parser failures - hide them.
D.cards = D.cards.filter(c => c.kind !== 'unknown');
// supply-vs-pulls scarcity: pulled minus currently-existing copies (normal+foil)
D.cards.forEach(c => { c.scarcity = (c.pulledNormal + c.pulledFoil) - ((c.existNormal ?? 0) + (c.existFoil ?? 0)); });
const tbody = document.querySelector('#table tbody');
const searchEl = document.getElementById('search');
let sortKeys = (() => {
  // restore the visitor's last sort config; default is tier rank, low to high
  const DEFAULT = [{ k: 'rarity', dir: 1 }];
  try {
    const saved = JSON.parse(localStorage.getItem('tcgSort') || 'null');
    const keys = new Set([...document.querySelectorAll('th')].map(th => th.dataset.k));
    if (Array.isArray(saved) && saved.length &&
        saved.every(s => s && keys.has(s.k) && (s.dir === 1 || s.dir === -1))) return saved;
  } catch {}
  return DEFAULT;
})();
function saveSort() { try { localStorage.setItem('tcgSort', JSON.stringify(sortKeys)); } catch {} }
const defaultDir = (k) => (k === 'name' || k === 'rarity') ? 1 : -1;

document.getElementById('sub').innerHTML =
  'Generated ' + new Date(D.generatedAt).toLocaleString() +
  ' &middot; pull rate = card pulls / all card pulls &middot; data from <a href="https://osrs-tcg.net/cards" target="_blank">osrs-tcg.net</a> &middot; hover a card\'s art to enlarge';

document.getElementById('stats').innerHTML = `
  <div class="stat chamfer-sm"><b>${D.cards.length.toLocaleString()}</b><span>cards</span></div>
  <div class="stat chamfer-sm"><b>${D.totalPulled.toLocaleString()}</b><span>total card pulls</span></div>
  <div class="stat chamfer-sm"><b>${D.cards.reduce((s,c)=>s+c.pulledFoil,0).toLocaleString()}</b><span>foil pulls</span></div>`;

// Official tier palette, decoded from the osrs-tcg.net client bundle.
const TIER_ORDER = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary', 'Mythic', 'Godly'];
const TIER_RANK = Object.fromEntries(TIER_ORDER.map((t, i) => [t, i]));
const COLLECTIONS = ['F2P', 'Kandarin', 'Misthalin', 'Asgarnia', 'Varlamore', 'Tirannwn',
                     'Fremennik', 'Kourend', 'Wilderness', 'Morytania', 'Sailing', 'Desert',
                     'Karamja', 'Clue'];

function fmt(n) { return n == null ? '-' : n.toLocaleString(undefined, { maximumFractionDigits: n < 1 ? 6 : 2 }); }
function artSrc(c) { return c.imagePath ? 'art' + c.imagePath.replace(/^\/images\/?/, '/') : null; }
function escapeAttr(s) { return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function wikiUrl(c) {
  const base = 'https://oldschool.runescape.wiki/w/';
  return c.wiki ? base + encodeURIComponent(c.wiki.replace(/ /g, '_')) : null;
}

// ---- multi-select filters ----
const sel = { tier: new Set(), coll: new Set(), type: new Set() };
const countBy = (fn) => { const m = {}; for (const c of D.cards) { const v = fn(c); if (v != null) m[v] = (m[v] || 0) + 1; } return m; };
const tierCounts = countBy(c => c.rarity);
const collCounts = {}; for (const c of D.cards) for (const v of (c.collections || [])) collCounts[v] = (collCounts[v] || 0) + 1;
const MS_DEFS = [
  { id: 'tier', emptyLabel: 'All tiers', values: TIER_ORDER.filter(t => tierCounts[t]).map(v => ({ v, l: `${v} (${tierCounts[v]})` })) },
  { id: 'coll', emptyLabel: 'All collections', values: COLLECTIONS.filter(v => collCounts[v]).map(v => ({ v, l: `${v} (${collCounts[v]})` })) },
  { id: 'type', emptyLabel: 'All types', values: [{ v: 'item', l: 'Item' }, { v: 'npc', l: 'NPC' }] },
];
const msEls = {};
for (const def of MS_DEFS) {
  const root = document.getElementById('ms-' + def.id);
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'mselect__btn';
  const menu = document.createElement('div');
  menu.className = 'mselect__menu'; menu.hidden = true;
  for (const { v, l } of def.values) {
    const opt = document.createElement('button');
    opt.type = 'button'; opt.className = 'mselect__opt'; opt.dataset.v = v;
    opt.innerHTML = `<span class="box"></span><span>${escapeAttr(l)}</span>`;
    opt.addEventListener('click', (e) => {
      e.stopPropagation();
      sel[def.id].has(v) ? sel[def.id].delete(v) : sel[def.id].add(v);
      syncMS(def.id);
      render();
    });
    menu.appendChild(opt);
  }
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    for (const other of Object.values(msEls)) if (other.menu !== menu) other.menu.hidden = true;
    menu.hidden = !menu.hidden;
  });
  root.append(btn, menu);
  msEls[def.id] = { btn, menu };
  syncMS(def.id);
}
function syncMS(id) {
  const def = MS_DEFS.find(d => d.id === id);
  const chosen = sel[id];
  const { btn, menu } = msEls[id];
  btn.classList.toggle('has-sel', chosen.size > 0);
  btn.innerHTML = chosen.size === 0 ? `${def.emptyLabel} <span class="caret">▾</span>`
    : chosen.size === 1 ? `${def.values.find(x => x.v === [...chosen][0]).l} <span class="caret">▾</span>`
    : `${def.emptyLabel}: ${chosen.size} selected <span class="caret">▾</span>`;
  for (const opt of menu.children) opt.classList.toggle('is-selected', chosen.has(opt.dataset.v));
}
document.addEventListener('click', () => { for (const { menu } of Object.values(msEls)) menu.hidden = true; });
function toggleTier(t) { sel.tier.has(t) ? sel.tier.delete(t) : sel.tier.add(t); syncMS('tier'); render(); }

// Cards whose item and NPC versions are tracked separately share a name;
// tag each row so the two can be told apart.
const splitNames = new Set();
{
  const counts = {};
  D.cards.forEach(c => { if (c.kind === 'item' || c.kind === 'npc') counts[c.name.toLowerCase()] = (counts[c.name.toLowerCase()] || 0) + 1; });
  Object.entries(counts).forEach(([n, k]) => { if (k > 1) splitNames.add(n); });
}
const KIND_TAG = { item: 'Item', npc: 'NPC', 'item+npc': 'Item+NPC' };

// ---- locked column widths ----
// Measured client-side from ALL cards (not just the rendered page) so lazy
// loading the next chunks never reflows the table. Canvas measureText is
// environment-accurate (user fonts/DPI) unlike anything precomputed at build
// time; re-measured once webfonts finish loading.
const tableEl = document.getElementById('table');
const CELL_PAD = 24; // .7rem x2 cell padding + border fudge
const ARROW_W = 26;  // sort arrow + (up to 2-digit) precedence number
const TAG_EXTRA = 24; // kindtag padding + border + margin-left
const CHIP_EXTRA = 21; // rarity chip padding + border
const NAME_EXTRA = 43; // 34px icon slot + flex gap
const measCtx = document.createElement('canvas').getContext('2d');
const bodyFont = getComputedStyle(document.body).fontFamily;
const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
function textW(s, sizeRem, weight) {
  measCtx.font = `${weight} ${sizeRem * rootPx}px ${bodyFont}`;
  return measCtx.measureText(s).width;
}
const COL_DEFS = [
  { k: 'name', header: 'Card' },
  { k: 'rarity', header: 'Tier' },
  { k: 'pulledNormal', header: 'Pulled (normal)' },
  { k: 'pulledFoil', header: 'Pulled (foil)' },
  { k: 'pulled', header: 'Total pulled' },
  { k: 'pullRatePct', header: 'Pull rate %' },
  { k: 'oneInX', header: '1 in X' },
  { k: 'existNormal', header: 'Exist (normal)' },
  { k: 'existFoil', header: 'Exist (foil)' },
  { k: 'scarcity', header: 'Pulled − exist' },
];
function lockColumnWidths() {
  const maxes = COL_DEFS.map(() => 0);
  for (const c of D.cards) {
    const tag = KIND_TAG[c.kind] && (c.kind !== 'item+npc' || splitNames.has(c.name.toLowerCase()));
    const nameW = textW(c.name, .84, 600) + (tag ? textW(KIND_TAG[c.kind], .68, 600) + TAG_EXTRA : 0);
    if (nameW > maxes[0]) maxes[0] = nameW;
    const chipW = textW(c.rarity || '?', .72, 700) + CHIP_EXTRA;
    if (chipW > maxes[1]) maxes[1] = chipW;
    const vals = [
      c.pulledNormal.toLocaleString(),
      c.pulledFoil.toLocaleString(),
      c.pulled.toLocaleString(),
      fmt(c.pullRatePct),
      c.oneInX ? Math.round(c.oneInX).toLocaleString() : '-',
      c.existNormal == null ? '-' : c.existNormal.toLocaleString(),
      c.existFoil == null ? '-' : c.existFoil.toLocaleString(),
      (c.scarcity > 0 ? '+' : '') + c.scarcity.toLocaleString(),
    ];
    for (let i = 0; i < vals.length; i++) {
      const w = textW(vals[i], .84, 400);
      if (w > maxes[i + 2]) maxes[i + 2] = w;
    }
  }
  const widths = COL_DEFS.map((d, i) =>
    Math.ceil(Math.max(maxes[i], textW(d.header, .8, 600)) +
      (i === 0 ? NAME_EXTRA : 0) + CELL_PAD + ARROW_W));
  let cg = tableEl.querySelector('colgroup');
  if (!cg) { cg = document.createElement('colgroup'); tableEl.insertBefore(cg, tableEl.firstElementChild); }
  cg.innerHTML = widths.map(w => `<col style="width:${w}px">`).join('');
}
lockColumnWidths();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(lockColumnWidths);

// Rows are rendered incrementally (PAGE_SIZE at a time) so typing in the
// search box never rebuilds thousands of DOM nodes at once; the sentinel row
// loads the next chunk when it scrolls near the bottom of the table.
const PAGE_SIZE = 250;
let filtered = [];
let renderedCount = 0;
const sentinel = document.createElement('tr');
sentinel.id = 'sentinel';
sentinel.innerHTML = '<td colspan="10" style="text-align:center;color:var(--rl-muted)">loading more…</td>';
const sentinelIO = new IntersectionObserver(onSentinel, { root: document.querySelector('.tablewrap'), rootMargin: '800px' });

function onSentinel(entries) {
  for (const e of entries) {
    if (e.isIntersecting) renderMore();
  }
}

function applyFilter() {
  const q = searchEl.value.toLowerCase();
  filtered = D.cards.filter(c => {
    if (q && !c.name.toLowerCase().includes(q)) return false;
    if (sel.tier.size && !sel.tier.has(c.rarity)) return false;
    if (sel.type.size) {
      const types = c.kind === 'item+npc' ? ['item', 'npc'] : [c.kind];
      if (!types.some(t => sel.type.has(t))) return false;
    }
    if (sel.coll.size && !(c.collections || []).some(x => sel.coll.has(x))) return false;
    return true;
  });
  filtered.sort((a, b) => {
    for (const { k, dir } of sortKeys) {
      let va, vb;
      if (k === 'rarity') { va = TIER_RANK[a.rarity] ?? -1; vb = TIER_RANK[b.rarity] ?? -1; }
      else { va = a[k]; vb = b[k]; }
      const cmp = (va == null ? -1 : vb == null ? 1 : va < vb ? -1 : va > vb ? 1 : 0) * dir;
      if (cmp !== 0) return cmp;
    }
    // tie-break alphabetically by name (always ascending)
    const na = a.name.toLowerCase(), nb = b.name.toLowerCase();
    return na < nb ? -1 : na > nb ? 1 : 0;
  });
}

function rowHtml(c) {
  const w = wikiUrl(c);
  const tag = KIND_TAG[c.kind] && (c.kind !== 'item+npc' || splitNames.has(c.name.toLowerCase()))
    ? ` <span class="kindtag">${KIND_TAG[c.kind]}</span>` : '';
  const tnameCls = c.rarity && TIER_ORDER.includes(c.rarity) ? ` tname-${c.rarity}` : '';
  const nameHtml = (w ? `<a class="tname${tnameCls}" href="${w}" target="_blank">${c.name}</a>`
                      : `<span class="tname${tnameCls}">${c.name}</span>`) + tag;
  const src = artSrc(c);
  const art = src
    ? `<span class="icon-slot" data-src="${escapeAttr(src)}"><img src="${escapeAttr(src)}" loading="lazy" decoding="async" fetchpriority="low" alt="" onerror="this.parentElement.classList.add('empty')"></span>`
    : '<span class="icon-slot empty"></span>';
  return `<tr>
    <td><span class="cardname">${art}${nameHtml}</span></td>
    <td>${c.rarity ? `<span class="rarity rarity-chip chamfer-sm" onclick="toggleTier('${c.rarity}')">${c.rarity}</span>` : '<span class="rarity unknown chamfer-sm">?</span>'}</td>
    <td class="num">${c.pulledNormal.toLocaleString()}</td>
    <td class="num">${c.pulledFoil.toLocaleString()}</td>
    <td class="num">${c.pulled.toLocaleString()}</td>
    <td class="num">${fmt(c.pullRatePct)}</td>
    <td class="num">${c.oneInX ? Math.round(c.oneInX).toLocaleString() : '-'}</td>
    <td class="num">${c.existNormal == null ? '-' : c.existNormal.toLocaleString()}</td>
    <td class="num">${c.existFoil == null ? '-' : c.existFoil.toLocaleString()}</td>
    <td class="num">${(c.scarcity > 0 ? '+' : '') + c.scarcity.toLocaleString()}</td>
  </tr>`;
}

function renderMore() {
  if (renderedCount >= filtered.length) return;
  const end = Math.min(filtered.length, renderedCount + PAGE_SIZE);
  sentinel.remove();
  const chunk = filtered.slice(renderedCount, end).map(rowHtml).join('');
  tbody.insertAdjacentHTML('beforeend', chunk);
  renderedCount = end;
  if (renderedCount < filtered.length) {
    tbody.appendChild(sentinel);
    sentinelIO.observe(sentinel);
  }
}

function render() {
  applyFilter();
  updateSortIndicators();
  tbody.innerHTML = '';
  renderedCount = 0;
  renderMore();
}

// show ▲/▼ on every sorted column, with its precedence when multi-sorting
document.querySelectorAll('th').forEach(th => { th.dataset.label = th.textContent; });
function updateSortIndicators() {
  const multi = sortKeys.length > 1;
  document.querySelectorAll('th').forEach(th => {
    const i = sortKeys.findIndex(s => s.k === th.dataset.k);
    th.innerHTML = i === -1 ? th.dataset.label
      : escapeAttr(th.dataset.label) + (sortKeys[i].dir === 1 ? ' ▲' : ' ▼') +
        (multi ? `<sup>${i + 1}</sup>` : '');
  });
}

// click: (re)sort by that column alone; shift-click: toggle direction if
// already sorted by it, otherwise append it as a secondary sort key
document.querySelectorAll('th').forEach(th => th.addEventListener('click', (e) => {
  const k = th.dataset.k;
  const idx = sortKeys.findIndex(s => s.k === k);
  if (e.shiftKey) {
    if (idx !== -1) sortKeys[idx].dir = -sortKeys[idx].dir;
    else sortKeys.push({ k, dir: defaultDir(k) });
  } else {
    if (sortKeys.length === 1 && idx === 0) sortKeys[0].dir = -sortKeys[0].dir;
    else sortKeys = [{ k, dir: defaultDir(k) }];
  }
  saveSort();
  render();
}));
let searchTimer;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 150);
});
render();

// ---- hover art preview (shows after ~1s over a card's art) ----
const preview = document.getElementById('preview');
const previewImg = preview.querySelector('img');
let previewTimer = null, mouseX = 0, mouseY = 0;
tbody.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
tbody.addEventListener('mouseover', (e) => {
  const slot = e.target.closest('.icon-slot');
  if (!slot || !slot.dataset.src) return;
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    previewImg.src = slot.dataset.src;
    preview.style.display = 'block';
    const r = preview.getBoundingClientRect();
    let x = mouseX + 18, y = mouseY + 12;
    if (x + r.width > innerWidth - 8) x = mouseX - r.width - 18;
    if (y + r.height > innerHeight - 8) y = Math.max(8, innerHeight - r.height - 8);
    preview.style.left = x + 'px';
    preview.style.top = y + 'px';
  }, 1000);
});
tbody.addEventListener('mouseout', (e) => {
  if (!e.target.closest('.icon-slot')) return;
  clearTimeout(previewTimer);
  preview.style.display = 'none';
});
document.querySelector('.tablewrap').addEventListener('scroll', () => {
  clearTimeout(previewTimer);
  preview.style.display = 'none';
}, { passive: true });
</script>
</body>
</html>
